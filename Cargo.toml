[package]
name = "parley-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "TideOS Eval Kit (Tool 8): Simulated users for multi-turn conversational evaluation, state and memory retention, sycophancy resistance, and policy violation gating."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TechTideOhio/parley"
homepage = "https://techtideai.io"
documentation = "https://github.com/TechTideOhio/parley#readme"
keywords = ["evals", "multi-turn", "simulated-user", "ai-agents", "deterministic"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "parley"
path = "src/main.rs"

[lib]
name = "parley"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
too_many_arguments = "allow"
unreadable_literal = "allow"
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
result_large_err = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
format_push_string = "allow"
items_after_statements = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
unnecessary_wraps = "allow"
doc_markdown = "allow"
manual_string_new = "allow"
manual_let_else = "allow"
case_sensitive_file_extension_comparisons = "allow"
redundant_closure = "allow"
redundant_closure_for_method_calls = "allow"
collapsible_if = "allow"
unnecessary_map_or = "allow"
bool_to_int_with_if = "allow"
manual_div_ceil = "allow"
cast_lossless = "allow"
assigning_clones = "allow"
double_ended_iterator_last = "allow"
trim_split_whitespace = "allow"
unused_self = "allow"
derivable_impls = "allow"
needless_bool = "allow"
question_mark = "allow"
if_not_else = "allow"
needless_borrows_for_generic_args = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
vec_init_then_push = "allow"
io_other_error = "allow"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
rstest = { version = "0.23", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
